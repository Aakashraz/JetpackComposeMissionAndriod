# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enables parallel builds for decoupled modules
org.gradle.parallel=true

# Reuses task outputs from previous builds to save CPU cycles
org.gradle.caching=true

# Enables Configuration Cache to skip configuration phases
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
